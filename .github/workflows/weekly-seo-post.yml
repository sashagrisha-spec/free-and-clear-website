name: Weekly SEO Blog Post

on:
  schedule:
    # 03:00 UTC every Sunday = 06:00 Israel time
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate a new blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Verify the site still builds
        run: npm run build

      - name: Commit and push (triggers Vercel auto-deploy)
        run: |
          if git diff --quiet lib/blog-posts.ts; then
            echo "No new post was generated. Nothing to commit."
            exit 0
          fi
          git config user.name "SEO Agent"
          git config user.email "seo-agent@freeandclearenglish.com"
          git add lib/blog-posts.ts
          git commit -m "feat: add SEO blog post - $(date +%Y-%m-%d)"
          git push
          echo "Pushed. Vercel will auto-deploy within ~1-2 minutes."
