name: Meet reminders

# Every 10 minutes, ask the site to send any due reminder for the free intro
# calls (/meet). The site marks each reminder as sent, so repeats are harmless.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.MEET_CRON_SECRET }}" \
            https://www.freeandclearenglish.com/api/meet/reminders
